<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self' data:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="商机管家 - 客户信息、商机进度与联系拜访记录管理">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>商机管家</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<noscript><div class="js-error">⚠️ 此应用需要启用 JavaScript，请在浏览器设置中开启后重新打开。</div></noscript>
<div id="js-error" class="js-error" hidden></div>

<header class="app-header">
  <div class="header-inner">
    <h1 id="pageTitle">首页</h1>
  </div>
</header>

<main id="main" class="main">
  <section class="page" id="page-home" data-title="首页"></section>

  <section class="page" id="page-customers" data-title="客户" hidden>
    <div class="searchbar"><input id="custQuery" class="search" type="search" placeholder="搜索客户姓名、公司、电话"></div>
    <div id="custList"></div>
  </section>

  <section class="page" id="page-opps" data-title="商机" hidden>
    <div class="searchbar"><input id="oppQuery" class="search" type="search" placeholder="搜索商机或客户"></div>
    <div class="chips" id="oppStageChips"></div>
    <div id="oppList"></div>
  </section>

  <section class="page" id="page-records" data-title="跟进" hidden>
    <div class="searchbar"><input id="recQuery" class="search" type="search" placeholder="搜索记录内容或客户"></div>
    <div class="chips" id="recTypeChips"></div>
    <div id="recList"></div>
  </section>

  <section class="page" id="page-more" data-title="我的" hidden>
    <div id="moreBody"></div>
  </section>
</main>

<button id="fab" class="fab" hidden aria-label="新增">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<nav class="tabbar">
  <div class="tabbar-inner">
    <button class="tab active" data-page="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span>首页</span>
    </button>
    <button class="tab" data-page="customers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>客户</span>
    </button>
    <button class="tab" data-page="opps">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      <span>商机</span>
    </button>
    <button class="tab" data-page="records">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><polyline points="9 16 11 18 15 14"/></svg>
      <span>跟进</span>
    </button>
    <button class="tab" data-page="more">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>我的</span>
    </button>
  </div>
</nav>

<!-- 客户详情底部抽屉 -->
<div id="backdrop" class="backdrop" hidden></div>
<div id="sheet" class="sheet" hidden>
  <div class="sheet-handle"></div>
  <div id="sheetBody"></div>
</div>

<!-- 通用弹窗（表单/确认） -->
<div id="modalBackdrop" class="backdrop" hidden></div>
<div class="modal-wrap" id="modalWrap" hidden><div class="modal" id="modalBox"></div></div>

<div id="toast"></div>
<input type="file" id="importInput" accept=".json,application/json" hidden>

<script src="app.js"></script>
</body>
</html>
