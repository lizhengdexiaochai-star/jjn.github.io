<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; img-src 'self' file: data: blob:; font-src 'self' file:; connect-src 'none'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2563eb">
<meta name="color-scheme" content="light">
<meta name="description" content="商机管家 - 客户、商机进度、跟进提醒与拜访照片管理（纯本地存储）">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="商机管家">
<title>商机管家</title>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>
<noscript><div class="js-error">⚠️ 此应用需要启用 JavaScript，请在浏览器设置中开启后重新打开。</div></noscript>
<div id="js-error" class="js-error" role="alert" hidden>
  <span id="jsErrorText"></span>
  <button type="button" id="jsErrorClose" class="js-error-close" aria-label="关闭错误提示">×</button>
</div>

<header class="app-header">
  <div class="header-inner">
    <h1 id="pageTitle">首页</h1>
    <span id="saveState" class="save-state" aria-live="polite"></span>
  </div>
</header>

<main id="main" class="main">
  <div id="globalBanner" class="global-banner" aria-live="polite" hidden></div>

  <section class="page" id="page-home" data-title="首页" aria-labelledby="pageTitle"></section>

  <section class="page" id="page-customers" data-title="客户" hidden aria-labelledby="pageTitle">
    <div class="searchbar"><label class="sr-only" for="custQuery">搜索客户</label>
      <input id="custQuery" class="search" type="search" placeholder="搜索客户姓名、联系人、电话、编号" autocomplete="off"></div>
    <div class="viewbar" id="custViewBar" role="group" aria-label="客户视图"></div>
    <div id="custList"></div>
  </section>

  <section class="page" id="page-opps" data-title="商机" hidden aria-labelledby="pageTitle">
    <div class="searchbar"><label class="sr-only" for="oppQuery">搜索商机</label>
      <input id="oppQuery" class="search" type="search" placeholder="搜索商机或客户" autocomplete="off"></div>
    <div class="viewbar" id="oppViewBar" role="group" aria-label="商机视图"></div>
    <div class="chips" id="oppStageChips" aria-label="按阶段筛选" hidden></div>
    <div id="oppKanban"></div>
    <div id="oppList" hidden></div>
  </section>

  <section class="page" id="page-records" data-title="跟进" hidden aria-labelledby="pageTitle">
    <div class="searchbar"><label class="sr-only" for="recQuery">搜索跟进记录</label>
      <input id="recQuery" class="search" type="search" placeholder="搜索记录内容或客户" autocomplete="off"></div>
    <div class="viewbar" id="recViewBar" role="group" aria-label="跟进视图"></div>
    <div class="chips" id="recTypeChips" aria-label="按类型筛选"></div>
    <div id="recList"></div>
  </section>

  <section class="page" id="page-more" data-title="我的" hidden aria-labelledby="pageTitle">
    <div id="moreBody"></div>
  </section>
</main>

<button id="fab" class="fab" hidden aria-label="新增记录">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<nav class="tabbar" aria-label="主导航">
  <div class="tabbar-inner">
    <button type="button" class="tab active" data-page="home" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span>首页</span>
    </button>
    <button type="button" class="tab" data-page="customers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>客户</span>
    </button>
    <button type="button" class="tab" data-page="opps">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      <span>商机</span>
    </button>
    <button type="button" class="tab" data-page="records">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><polyline points="9 16 11 18 15 14"/></svg>
      <span>跟进</span>
    </button>
    <button type="button" class="tab" data-page="more">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>我的</span>
    </button>
  </div>
</nav>

<!-- 客户详情底部抽屉 -->
<div id="backdrop" class="backdrop" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="客户详情" hidden>
  <div class="sheet-handle" aria-hidden="true"></div>
  <div id="sheetBody"></div>
</div>

<!-- 通用弹窗（表单/确认） -->
<div id="modalBackdrop" class="backdrop" hidden></div>
<div class="modal-wrap" id="modalWrap" hidden>
  <div class="modal" id="modalBox" role="dialog" aria-modal="true" aria-label="对话框"></div>
</div>

<div id="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
<input type="file" id="importInput" accept=".json,application/json" hidden>

<script src="app.js"></script>
</body>
</html>
