      x.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }));
  if(opp){
    $('#f-odel').addEventListener('click', () => {
      closeModal();
      confirmDlg({
        title: '删除商机',
        msg: '确定删除「' + opp.name + '」？关联的跟进记录会保留，但会解除与本商机的关联。',
        okText: '删除', danger: true,
        onOk: () => {
          takeSnapshot('before-delete-opp', deepClone(db));
          db.opps = db.opps.filter(x => x.id !== opp.id);
          db.reminders = db.reminders.filter(r => r.oppId !== opp.id);
          db.records.forEach(r => {
            if(r.oppId === opp.id){
              r.oppId = '';
              if(r.remindAt) syncRecordReminder(r);
            }
          });
          commit('商机已删除');
          invalidateAll(); renderActive();
        }
      });
    });
  }
  $('#oppForm').addEventListener('submit', ev => {
    ev.preventDefault();
    const name = $('#f-oname').value.trim();
    const customerId = $('#f-ocust').value;
    if(!name){ toast('请填写商机名称'); $('#f-oname').focus(); return; }
    if(!customerId){ toast('请选择关联客户'); return; }
    const stageRaw = $('#f-ostage').value;
    const stage = STAGES.some(s => s.id === stageRaw) ? stageRaw : 'lead';
    const statusRaw = $('#f-ostatus').value;
    const status = OPP_STATUS.indexOf(statusRaw) >= 0 ? statusRaw : '进行中';
    const lost = $('#f-olost').value.trim();
    if(status === '丢单' && !lost){ toast('丢单请填写丢单原因'); $('#f-olost').focus(); return; }
    if(status === '丢单' && stage === 'deal'){ toast('已丢单的商机不能处于「签单」阶段，请调整阶段或状态'); return; }
    const data = {
      customerId: customerId,
      name: name,
      stage: stage,
      amount: numOrEmpty($('#f-oamount').value),
      expectDate: $('#f-oexpect').value,
      dealAmount: numOrEmpty($('#f-odealamount').value),
      category: $('#f-ocategory').value,
      competitor: $('#f-ocompetitor').value.trim(),
      status: status,
      lostReason: lost,
      owner: $('#f-oowner').value || db.settings.me || '我'
    };
    let saved, msg, stageChanged;
    if(opp){
      const oldStage = opp.stage;
      const patch = Object.assign({}, data);
      stageChanged = oldStage !== stage;
      if(stageChanged){
        patch.history = (opp.history || []).concat([{at: nowStr(), from: stageById(oldStage).name, to: stageById(stage).name}]);
      }
      if(stage === 'deal' && !opp.winAt) patch.winAt = todayStr();
      Object.assign(opp, patch);
      opp.updatedAt = nowStr();
      saved = opp;
      msg = '商机已保存';
    }else{
      saved = Object.assign({id:'o_' + uid()}, data, {
        code: 'O' + pad4(db.seq.o++),
        history: [{at: nowStr(), from: '—', to: stageById(stage).name}],
        winAt: stage === 'deal' ? todayStr() : '',
        createdAt: nowStr(), updatedAt: nowStr()
      });
      db.opps.push(saved);
      msg = '商机已添加（编号 ' + saved.code + '）';
      stageChanged = true;
    }
    if(stageChanged) syncStageReminder(saved, true);
    else syncStageReminder(saved, false);
    commit(msg);
    closeModal();
    invalidateAll();
    renderActive();
  });
}
function applyOppStage(oppId, stageId, silent){
  const o = oppById(oppId);
  if(!o) return;
  if(o.stage === stageId){ if(!silent) toast('已经是「' + stageById(stageId).name + '」阶段'); return; }
  const from = stageById(o.stage).name;
  const to = stageById(stageId);
  o.stage = stageId;
  o.updatedAt = nowStr();
  if(!o.history) o.history = [];
  o.history.push({at: nowStr(), from: from, to: to.name});
  if(stageId === 'deal' && !o.winAt) o.winAt = todayStr();
  syncStageReminder(o);
  commit('已切到「' + to.name + '」' + (STAGE_RULES[stageId] ? '，已自动创建跟进提醒' : ''));
  invalidateAll();
  renderActive();
}
function setOppStage(oppId, stageId){
  const o = oppById(oppId);
  if(!o) return;
  if(o.stage === stageId){ toast('已经是「' + stageById(stageId).name + '」阶段'); return; }
  if(o.status === '丢单'){
    confirmDlg({
      title: '恢复丢单商机？',
      msg: '「' + o.name + '」当前标记为丢单。移动阶段会把它恢复为「进行中」，并清除原来的丢单原因。是否继续？',
      okText: '恢复并移动',
      onOk: () => {
        o.status = '进行中';
        o.lostReason = '';
        applyOppStage(oppId, stageId);
      }
    });
    return;
  }
  if(o.status === '暂停') toast('该商机处于暂停状态，阶段已变更但状态仍为暂停');
  applyOppStage(oppId, stageId);
}
function openStagePicker(oppId){
  const o = oppById(oppId);
  if(!o) return;
  openModal(
    '<div class="modal-head">移动商机阶段</div>' +
    '<div class="muted modal-sub">' + esc(o.name) + '</div>' +
    '<div class="stage-chips">' + STAGES.map(s =>
      '<button type="button" class="st-chip ' + s.cls + (o.stage === s.id ? ' on' : '') + '" data-pick-stage="' + s.id + '">' + s.name + '</button>'
    ).join('') + '</div>' +
    '<div class="form-btns"><button type="button" class="btn ghost" data-close>取消</button></div>'
  );
  $$('#modalBox [data-pick-stage]').forEach(b => b.addEventListener('click', () => {
    const stage = b.dataset.pickStage;
    closeModal();
    setOppStage(oppId, stage);
  }));
}
function nextStageId(oppId){
  const o = oppById(oppId);
  if(!o) return 'lead';
  const i = STAGES.findIndex(s => s.id === o.stage);
  return STAGES[Math.min(STAGES.length - 1, i + 1)].id;
}
function prevStageId(oppId){
  const o = oppById(oppId);
  if(!o) return 'lead';
  const i = STAGES.findIndex(s => s.id === o.stage);
  return STAGES[Math.max(0, i - 1)].id;
}

let tempPhotos = [];
function openRecordForm(rec, presetCustomerId){

    toast('请先添加客户');

      '<div class="field"><label for="f-rremind">下次跟进提醒（精确到分钟）</label>' +
        '<input id="f-rremind" type="datetime-local" value="' + esc(r.remindAt || '') + '">' +
        '<div class="quick-row">' +
          '<button type="button" class="mini-btn ghost" data-remind-preset="' + esc(dstrAt(0, '18:00')) + '">今天 18:00</button>' +
          '<button type="button" class="mini-btn ghost" data-remind-preset="' + esc(dstrAt(1, '09:00')) + '">明天 09:00</button>' +
          '<button type="button" class="mini-btn ghost" data-remind-preset="' + esc(dstrAt(3, '09:00')) + '">3 天后</button>' +
          '<button type="button" class="mini-btn ghost" data-remind-clear="1">清除</button>' +

    $('#f-rtype').value = b.dataset.rtype;
    $$('#recForm .seg-btn').forEach(x => {
      const on = x === b;
      x.classList.toggle('on', on);
      x.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }));
  $$('#recForm [data-remind-preset]').forEach(b => b.addEventListener('click', () => {
    $('#f-rremind').value = b.dataset.remindPreset;
  }));
  $$('#recForm [data-remind-clear]').forEach(b => b.addEventListener('click', () => {
    $('#f-rremind').value = '';
  }));
  renderPhotoList();
  $('#f-rophotos').addEventListener('change', async function(){
    const files = Array.from(this.files || []);
    this.value = '';
    if(!files.length) return;
    if(photoMode !== 'idb'){
      const ok = await ensurePhotoStore();
      if(!ok){ toast('当前浏览器无法保存照片（IndexedDB 不可用）'); return; }
    }
    if(tempPhotos.length >= PHOTO_MAX){ toast('最多 ' + PHOTO_MAX + ' 张照片'); return; }
    const room = PHOTO_MAX - tempPhotos.length;
    if(files.length > room) toast('最多还能添加 ' + room + ' 张，已自动截取');
    const batch = files.slice(0, room);
    runtime.photoBusy = true;
    setRecSubmitBusy(true);
    const status = $('#photoStatus');
    if(status){ show(status); status.textContent = '正在处理 0/' + batch.length; status.className = 'photo-status'; }
    let failed = 0, lastError = '';
    for(let i = 0; i < batch.length; i++){
      try{
        const dataUrl = await compressImage(batch[i]);
        const id = await persistPhoto(dataUrl);
        tempPhotos.push({id: id, src: dataUrl});
        renderPhotoList();
      }catch(e){
        failed++;
        lastError = e && e.message ? e.message : '读取失败';
      }
      if(status) status.textContent = '正在处理 ' + (i+1) + '/' + batch.length;
    }
    runtime.photoBusy = false;
    setRecSubmitBusy(false);
    if(status){
      if(failed){
        status.textContent = failed + ' 张照片失败' + (lastError ? '：' + lastError : '');

      }else{

    if(!content){ toast('请填写跟进内容'); $('#f-rcontent').focus(); return; }
    const oldCustomerId = rec ? rec.customerId : '';
    const time = normDateTime($('#f-rtime').value) || nowInput();
    const data = {
      customerId: customerId,
      oppId: $('#f-ropp').value || '',
      type: $('#f-rtype').value,
      time: time,
      content: content,
      feedback: $('#f-rfeedback').value.trim(),
      nextPlan: $('#f-rnextplan').value.trim(),

      db.records.push(saved);
    }
    recalcCustomerFollow(customerId);
    if(oldCustomerId && oldCustomerId !== customerId) recalcCustomerFollow(oldCustomerId);
    syncRecordReminder(saved);
    touchOpp(saved.oppId, time);
    commit(rec ? '已保存' : '跟进记录已保存');

    invalidateAll();
    renderActive();
  });

function renderPhotoList(){

function recalcCustomerFollow(customerId){
  if(!customerId) return;
  const c = custById(customerId);
  if(!c) return;
  let latest = '';
  db.records.forEach(r => {
    if(r.customerId !== customerId) return;
    const t = fmtDT(r.time);
    if(t !== '—' && t > latest) latest = t;
  });
  c.lastFollowAt = latest;
}
function refreshCustomerReminderTexts(customerId){
  db.records.forEach(r => {
    if(r.customerId === customerId && r.remindAt) syncRecordReminder(r);
  });
  db.opps.forEach(o => {
    if(o.customerId === customerId && STAGE_RULES[o.stage]) syncStageReminder(o, false);
  });
}
function touchOpp(oppId, time){
  if(!oppId) return;
  const o = oppById(oppId);
  if(!o) return;
  const t = fmtDT(time);
  if(t !== '—' && (!o.updatedAt || t > o.updatedAt)) o.updatedAt = t;
}

async function openSnapshots(){
  openModal(
    '<div class="modal-head">自动快照与恢复</div>' +

    '<div id="snapBody"><div class="muted">正在读取…</div></div>' +
    '<div class="form-btns">' +
      '<button type="button" class="btn" id="snapNow">立即创建快照</button>' +
      '<button type="button" class="btn ghost danger-text" id="snapPurge">清空快照</button>' +
      '<button type="button" class="btn ghost" data-close>关闭</button></div>'
  );
  const body = $('#snapBody');
  const list = await listSnapshots();
  if(!list.length){
    body.innerHTML = '<div class="empty">还没有快照。点击「立即创建快照」可手动备份一份文字数据。</div>';
  }else{
    body.innerHTML = list.map(s => {
      const sum = s.summary || {};
      const at = Number(s.at);
      if(!isFinite(at)) return '';
      return '<div class="remind-row">' +
        '<div class="remind-main"><div class="remind-text">' + esc(s.time || fmtDT(new Date(at))) + '</div>' +
        '<div class="muted">' + esc(s.reason === 'auto' ? '自动' : '手动') +
        ' · 客户 ' + esc(String(sum.customers || 0)) +
        ' · 商机 ' + esc(String(sum.opps || 0)) +
        ' · 跟进 ' + esc(String(sum.records || 0)) + '</div></div>' +
        '<button type="button" class="mini-btn primary" data-snap-restore="' + at + '">恢复</button>' +
      '</div>';
    }).join('');
    $$('#snapBody [data-snap-restore]').forEach(b => b.addEventListener('click', () => {
      restoreSnapshot(Number(b.dataset.snapRestore));
    }));
  }
  $('#snapNow').addEventListener('click', async () => {
    const ok = await takeSnapshot('manual', deepClone(db));
    toast(ok ? '快照已创建' : '快照创建失败（存储不可用或数据过大）');
    closeModal(true);
    openSnapshots();
  });
  $('#snapPurge').addEventListener('click', () => {
    confirmDlg({
      title: '清空自动快照',
      msg: '将删除本机保存的所有文字快照（不包括当前正在使用的数据）。删除后无法再从快照恢复，确定？',
      okText: '清空快照', danger: true,
      onOk: async () => {
        try{ await IDB.request('snapshots', 'readwrite', s => s.clear()); }catch(e){}
        lastSnapshotAt = 0;
        toast('自动快照已清空');
        closeModal(true);
        openSnapshots();
      }
    });
  });
}
async function restoreSnapshot(at){
  const snap = await readSnapshot(at);
  if(!snap){ toast('快照不存在或已损坏'); return; }
  let parsed;
  try{ parsed = JSON.parse(snap.text); }
  catch(e){ toast('快照内容损坏，无法恢复'); return; }
  const n = normalizeDB(parsed);
  confirmDlg({
    title: '恢复快照',
    msg: '将用 ' + fmtDT(snap.time) + ' 的快照覆盖当前数据（客户 ' + n.db.customers.length +
      '、商机 ' + n.db.opps.length + '、跟进 ' + n.db.records.length + '）。当前数据会先自动备份一份。确定恢复？',
    okText: '恢复', danger: true,
    onOk: async () => {
      await takeSnapshot('before-restore', deepClone(db));
      db = n.db;
      const missing = db.records.reduce((acc, r) =>
        acc + (r.photos || []).filter(id => !photoCache.has(id)).length, 0);
      if(n.photos.length) await persistPendingPhotos(n.photos);
      corruptInfo = null;
      save({snapshot: true, reason: 'restore'});
      invalidateAll();
      renderAll();
      toast('快照已恢复' + (missing ? '；有 ' + missing + ' 张照片在本机照片库中不存在' : ''));
      closeModal(true);
    }
  });
}
async function persistPendingPhotos(photos){
  if(photoMode !== 'idb') return 0;
  let failed = 0;
  for(const p of photos || []){
    try{ await persistPhotoWithId(p.id, p.dataUrl); }
    catch(e){ failed++; }
  }
  return failed;
}

/* ==================== 下载 / 导出 ==================== */
function download(content, filename, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
async function exportJSON(){
  try{
    const out = deepClone(db);
    out.app = '商机管家';
    out.exportedAt = nowStr();
    out.exportVersion = SCHEMA_VERSION;
    out.photosInline = true;
    let count = 0, missing = 0;
    out.records.forEach((r, i) => {
      const ids = db.records[i].photos || [];
      const arr = [];
      ids.forEach(id => {
        const src = photoSrc(id);
        if(src){ arr.push(src); count++; }
        else missing++;
      });
      r.photos = arr;
    });
    const text = JSON.stringify(out, null, 2);
    download(text, '商机管家备份_' + todayStr() + '.json', 'application/json');
    db.settings.lastExportAt = nowStr();
    save({silent: true});
    invalidateAll();
    if(state.page === 'more') renderMore();
    renderSaveState();
    toast('备份已导出' + (count ? '，含 ' + count + ' 张照片' : '') + (missing ? '；' + missing + ' 张照片缺失' : ''));
  }catch(e){
    toast('导出失败：' + (e && e.message ? e.message : e));
  }
}
function csvCell(v){
  let s = String(v == null ? '' : v);
  if(/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}
function exportCSV(kind){

  }else if(kind === 'opps'){

    rows = db.opps.map(o => [o.code, custName(o.customerId), o.name, stageById(o.stage).name, o.amount, o.expectDate, o.dealAmount, o.category, o.competitor, o.status, o.lostReason, o.owner, o.winAt, o.createdAt]);
  }else{
    head = ['客户名称','关联商机','跟进类型','跟进时间','跟进内容','客户反馈','下次跟进计划','下次提醒时间','拜访照片(张)','跟进人'];

    });
  }
  const csv = '\ufeff' + [head].concat(rows).map(r => r.map(csvCell).join(',')).join('\r\n');
  download(csv, ({customers:'客户表',opps:'商机表',records:'跟进记录'}[kind]) + '_' + todayStr() + '.csv', 'text/csv;charset=utf-8');
  toast('已导出 CSV');

/* ==================== 导入 ==================== */
async function importBackup(file){
  if(!file) return;
  if(file.size > MAX_IMPORT_BYTES){ toast('文件超过 80MB，无法导入'); return; }
  let text;
  try{ text = await file.text(); }
  catch(e){ toast('文件读取失败'); return; }
  let parsed;
  try{ parsed = JSON.parse(text); }
  catch(e){ toast('不是有效的 JSON 备份文件'); return; }
  const n = normalizeDB(parsed);
  const total = n.db.customers.length + n.db.opps.length + n.db.records.length;
  if(!total && !n.photos.length){
    toast('备份里没有可导入的数据');
    return;
  }
  if(n.photos.length && photoMode !== 'idb'){
    toast('当前浏览器无法保存照片，导入会丢失照片；请换用普通模式或关闭无痕模式后重试');
    return;
  }
  confirmDlg({
    title: '导入数据备份',
    msg: '备份包含：客户 ' + n.db.customers.length + ' 个、商机 ' + n.db.opps.length +
      ' 个、跟进 ' + n.db.records.length + ' 条、照片 ' + n.photos.length + ' 张。\n\n' +
      '导入会覆盖当前全部数据，当前数据会先自动创建一份快照。确定继续？',
    okText: '覆盖并导入', danger: true,
    onOk: async () => {
      await takeSnapshot('before-import', deepClone(db));
      let failed = 0;
      if(n.photos.length){
        failed = await persistPendingPhotos(n.photos);
      }
      db = n.db;
      if(failed){
        const okIds = new Set(n.photos.map(p => p.id));
        /* 失败的照片无法显示，避免留下空引用 */
        const failedIds = new Set();
        n.photos.forEach(p => { if(!okIds.has(p.id) || !photoCache.has(p.id)) failedIds.add(p.id); });
        if(failedIds.size){
          db.records.forEach(r => { r.photos = (r.photos || []).filter(id => !failedIds.has(id)); });
        }
      }
      save();
      invalidateAll();
      renderAll();
      toast('导入完成' + (failed ? ('；' + failed + ' 张照片写入失败') : ''));
      sweepOrphans();
    }
  });
}

    '数据版本：schema v' + SCHEMA_VERSION + '\n' +
    '访问协议：' + location.protocol + ' // ' + location.host + '\n' +
    '本地存储：' + (storageOK() ? '可用' : '不可用（无痕/隐私模式？）') + '\n' +
    '保存状态：' + (runtime.saveError ? ('失败：' + runtime.saveError) : (runtime.lastSavedAt ? '正常' : '尚未写入')) + '\n' +
    '文字数据占用：' + storageUsageKB() + ' KB\n' +
    '照片存储：' + (photoMode === 'idb' ? ('IndexedDB，' + photoCount() + ' 张') : '不可用') + '\n' +
    '浏览器估算占用：' + estimate + '\n' +
    '数据量：客户 ' + db.customers.length + ' · 商机 ' + db.opps.length +
    ' · 跟进 ' + db.records.length + ' · 提醒 ' + db.reminders.length + '\n' +
    'Service Worker：' + (runtime.swStatus === 'ready' ? '已控制' : '未控制') + '\n' +
    '通知权限：' + (notificationSupported() ? Notification.permission : '不支持') + '\n' +
    '屏幕：' + (window.screen ? window.screen.width + '×' + window.screen.height : '') + '\n' +
    '浏览器：' + ua;
  openModal(
    '<div class="modal-head">诊断信息</div>' +
    '<pre class="diag-pre">' + esc(txt) + '</pre>' +
    '<div class="form-btns">' +
      '<button type="button" class="btn" id="diagCopy">复制</button>' +
      '<button type="button" class="btn ghost" data-close>关闭</button></div>'
  );
  $('#diagCopy').onclick = async () => {
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(txt);
      }else{
        const ta = document.createElement('textarea');
        ta.value = txt; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
      }
      toast('已复制诊断信息');
    }catch(e){ toast('复制失败，请手动选择文本'); }
  };
}

/* ==================== 看板拖拽 ==================== */
let drag = null;
function startDrag(oppId, e){
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  const card = e.target.closest('.kanban-card');
  if(!card) return;
  e.preventDefault();
  const rect = card.getBoundingClientRect();
  const ghost = card.cloneNode(true);
  ghost.classList.add('ghost');
  ghost.style.width = rect.width + 'px';
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  document.body.appendChild(ghost);
  card.classList.add('dragging-src');
  drag = {
    oppId: oppId, ghost: ghost, src: card,
    offX: e.clientX - rect.left, offY: e.clientY - rect.top,
    moved: false
  };
  document.addEventListener('pointermove', onDragMove, {passive:false});
  document.addEventListener('pointerup', onDragEnd);
  document.addEventListener('pointercancel', onDragEnd);
  document.body.classList.add('dragging');
}
function onDragMove(e){
  if(!drag) return;
  e.preventDefault();
  const dx = e.clientX - (parseFloat(drag.ghost.style.left) + drag.offX);
  const dy = e.clientY - (parseFloat(drag.ghost.style.top) + drag.offY);
  if(Math.abs(dx) > 3 || Math.abs(dy) > 3) drag.moved = true;
  drag.ghost.style.left = (e.clientX - drag.offX) + 'px';
  drag.ghost.style.top = (e.clientY - drag.offY) + 'px';
  $$('.kanban-col').forEach(c => c.classList.remove('over'));
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const col = el ? el.closest('.kanban-col') : null;
  if(col) col.classList.add('over');
}
function onDragEnd(e){
  if(!drag) return;
  const d = drag;
  drag = null;
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', onDragEnd);
  document.removeEventListener('pointercancel', onDragEnd);
  document.body.classList.remove('dragging');
  if(d.ghost && d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
  if(d.src) d.src.classList.remove('dragging-src');
  $$('.kanban-col').forEach(c => c.classList.remove('over'));
  if(!d.moved){ openStagePicker(d.oppId); return; }
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const col = el ? el.closest('.kanban-col') : null;
  if(col && col.dataset.stage) setOppStage(d.oppId, col.dataset.stage);
}

/* ==================== 事件绑定 ==================== */
function bindEvents(){
  $$('.tab').forEach(b => b.addEventListener('click', () => showPage(b.dataset.page)));

  $('#fab').addEventListener('click', () => {
    if(state.page === 'home') openFabMenu();
    else if(state.page === 'customers') openCustomerForm();
    else if(state.page === 'opps') openOppForm();
    else openRecordForm();
  });

  $('#backdrop').addEventListener('click', closeSheet);
  $('#modalBackdrop').addEventListener('click', () => closeModal());
  $('#modalBox').addEventListener('click', e => { if(e.target.closest('[data-close]')) closeModal(); });
  $('#sheetBody').addEventListener('click', e => {
    if(e.target.closest('[data-close-sheet]')){ closeSheet(); return; }
    const eo = e.target.closest('[data-edit-opp]');
    if(eo){ closeSheet(); openOppForm(oppById(eo.dataset.editOpp)); return; }
    const er = e.target.closest('[data-edit-rec]');
    if(er){ closeSheet(); openRecordForm(db.records.find(x => x.id === er.dataset.editRec)); return; }
  });
  $('#sheet').addEventListener('click', e => {
    if(e.target.closest('[data-close-sheet]')) closeSheet();
  });
  document.addEventListener('click', e => {
    if(e.target.closest('[data-close-sheet]')) closeSheet();
  });

  const doCustSearch = debounce(() => { if(state.page === 'customers') renderCustomers(); }, 180);
  const doOppSearch = debounce(() => { if(state.page === 'opps') renderOpps(); }, 180);
  const doRecSearch = debounce(() => { if(state.page === 'records') renderRecords(); }, 180);
  $('#custQuery').addEventListener('input', e => { state.custQuery = e.target.value; doCustSearch(); });
  $('#oppQuery').addEventListener('input', e => { state.oppQuery = e.target.value; doOppSearch(); });
  $('#recQuery').addEventListener('input', e => { state.recQuery = e.target.value; doRecSearch(); });

  $('#custViewBar').addEventListener('click', e => {
    const b = e.target.closest('[data-view]');
    if(!b) return;
    state.custView = b.dataset.view;
    persistUISettings();
    renderCustomers();
  });
  $('#oppViewBar').addEventListener('click', e => {
    const b = e.target.closest('[data-view]');
    if(!b) return;
    state.oppView = b.dataset.view;
    persistUISettings();
    renderOpps();
  });
  $('#recViewBar').addEventListener('click', e => {
    const b = e.target.closest('[data-view]');
    if(!b) return;
    state.recView = b.dataset.view;
    persistUISettings();
    renderRecords();
  });
  $('#oppStageChips').addEventListener('click', e => {
    const b = e.target.closest('[data-stage]');
    if(b){ state.oppStage = b.dataset.stage; renderOpps(); }
  });
  $('#recTypeChips').addEventListener('click', e => {
    const b = e.target.closest('[data-type]');
    if(b){ state.recType = b.dataset.type; renderRecords(); }
  });

  $('#page-home').addEventListener('click', e => {
    const qa = e.target.closest('[data-qa]');
    if(qa){
      if(qa.dataset.qa === 'customer') openCustomerForm();
      else if(qa.dataset.qa === 'opp') openOppForm();
      else openRecordForm();
      return;
    }
    const gt = e.target.closest('[data-goto-table]');
    if(gt){
      const page = gt.dataset.gotoTable;
      if(page === 'customers') state.custView = 'table';
      if(page === 'opps'){ state.oppView = 'table'; state.oppStage = 'all'; }
      if(page === 'records') state.recView = 'table';
      dirtyPages.add(page);
      showPage(page);
      return;
    }
    if(e.target.closest('[data-open-reminders]')){ openReminders(); return; }
    if(e.target.closest('[data-goto-records]')){ showPage('records'); return; }
    const rd = e.target.closest('[data-rem-done]');
    if(rd){ completeReminder(rd.dataset.remDone); return; }
    const rg = e.target.closest('[data-rem-goto]');
    if(rg){
      if(rg.dataset.remGoto && custById(rg.dataset.remGoto)) openCustomer(rg.dataset.remGoto);
      else { toast('关联客户已删除，可直接新建跟进记录'); openRecordForm(); }
      return;
    }
    const fr = e.target.closest('[data-open-rec]');
    if(fr){ openRecordForm(db.records.find(x => x.id === fr.dataset.openRec)); return; }
  });

  $('#custList').addEventListener('click', e => {
    const it = e.target.closest('[data-open]');
    if(it) openCustomer(it.dataset.open);
  });
  $('#custList').addEventListener('keydown', e => {
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const it = e.target.closest('[data-open]');
    if(it){ e.preventDefault(); openCustomer(it.dataset.open); }
  });

  const oppBox = $('#page-opps');
  oppBox.addEventListener('pointerdown', e => {
    const grip = e.target.closest('[data-drag]');
    if(grip) startDrag(grip.dataset.drag, e);
  });
  oppBox.addEventListener('click', e => {
    if(e.target.closest('.drag-grip')) return;
    const p = e.target.closest('[data-prev]');
    if(p){ setOppStage(p.dataset.prev, prevStageId(p.dataset.prev)); return; }
    const n = e.target.closest('[data-next]');
    if(n){ setOppStage(n.dataset.next, nextStageId(n.dataset.next)); return; }
    const it = e.target.closest('[data-opp]');
    if(it) openOppForm(oppById(it.dataset.opp));
  });
  oppBox.addEventListener('keydown', e => {
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const it = e.target.closest('[data-opp]');
    if(it && !e.target.closest('button')){ e.preventDefault(); openOppForm(oppById(it.dataset.opp)); }
  });

  $('#recList').addEventListener('click', e => {
    const more = e.target.closest('[data-img-more]');
    if(more){ openImageView(more.dataset.imgMore, 4); return; }
    const img = e.target.closest('[data-img]');
    if(img){
      const parts = img.dataset.img.split('|');
      openImageView(parts[0], Number(parts[1]));
      return;
    }
    const it = e.target.closest('[data-rec]');
    if(it) openRecordForm(db.records.find(x => x.id === it.dataset.rec));
  });
  $('#recList').addEventListener('keydown', e => {
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const it = e.target.closest('[data-rec]');
    if(it && !e.target.closest('button')){ e.preventDefault(); openRecordForm(db.records.find(x => x.id === it.dataset.rec)); }
  });

  $('#moreBody').addEventListener('click', e => {
    const act = e.target.closest('[data-act]');
    if(!act) return;
    const a = act.dataset.act;
    if(a === 'export') exportJSON();
    else if(a === 'import') $('#importInput').click();
    else if(a === 'snapshots') openSnapshots();
    else if(a === 'ics') exportICS();
    else if(a === 'notify') requestNotifications().then(() => { if(state.page === 'more') renderMore(); });
    else if(a === 'csv-c') exportCSV('customers');
    else if(a === 'csv-o') exportCSV('opps');
    else if(a === 'csv-r') exportCSV('records');
    else if(a === 'members') openMemberSettings();
    else if(a === 'diag') openDiagnostics();
    else if(a === 'demo'){
      confirmDlg({
        title: '载入示例数据',
        msg: '将添加 3 个示例客户、4 个商机、5 条跟进记录（不覆盖现有数据）。继续？',
        okText: '载入',
        onOk: seedDemo
      });
    }
    else if(a === 'clear') clearAllData();
  });
  $('#moreBody').addEventListener('toggle', e => {
    const d = e.target.closest('details[data-help]');
    if(d) state.helpOpen[d.dataset.help] = d.open;
  }, true);

  $('#globalBanner').addEventListener('click', e => {
    const b = e.target.closest('[data-banner]');
    if(!b) return;
    if(b.dataset.banner === 'export') exportJSON();
    else if(b.dataset.banner === 'retry'){ save(); toast(runtime.saveError ? '仍然保存失败' : '已重新保存成功'); }
    else if(b.dataset.banner === 'corrupt') openCorruptDialog();
  });

  $('#importInput').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    importBackup(f);
  });

  document.addEventListener('keydown', e => {
    handleModalKeydown(e);
    viewerKey(e);
    if(e.key === 'Escape' && !runtime.modalOpen && !$('#sheet').hidden) closeSheet();
  });

  window.addEventListener('hashchange', () => {
    const p = (location.hash || '').replace(/^#\//, '');
    if(p && p !== state.page && $('#page-' + p)) showPage(p);
  });

  window.addEventListener('beforeunload', e => {
    if(runtime.unsaved || runtime.saveError){
      e.preventDefault();
      e.returnValue = '';
      return '';
    }
  });

  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') checkDueNotifications();
  });
  setInterval(checkDueNotifications, 60000);
}

/* ==================== Service Worker / PWA ==================== */
function ensureManifest(){
  if(!location.protocol.startsWith('http')) return;
  if(document.querySelector('link[rel="manifest"]')) return;
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = 'manifest.webmanifest';
  document.head.appendChild(link);
}
function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  if(!location.protocol.startsWith('http')) return;
  navigator.serviceWorker.register('sw.js').then(() => {
    runtime.swStatus = 'ready';
    if(state.page === 'more') renderMore();
  }).catch(() => {
    runtime.swStatus = 'none';
    if(state.page === 'more') renderMore();
  });
}

/* ==================== 启动 ==================== */
async function boot(){
  bindErrorBar();
  try{
    initDB();
  }catch(e){
    corruptInfo = {raw: '', key: '', error: e && e.message ? e.message : String(e)};
    db = emptyDB();
  }
  await initPhotoStore();
  bindEvents();
  const initPage = (location.hash || '').replace(/^#\//, '');
  showPage(initPage && $('#page-' + initPage) ? initPage : 'home');
  renderSaveState();
  renderGlobal();

  if(legacySourceKey && !photoMigrationFailed) save({silent: true});
  else if(legacySourceKey && photoMigrationFailed){
    toast('旧版数据已载入，但部分照片写入失败；旧数据暂时保留，请先导出备份');
  }
  if(corruptInfo) setTimeout(openCorruptDialog, 400);
  ensureManifest();
  registerSW();
  if(!/[?&]test=1(?:&|$)/.test(location.search)) setTimeout(checkDueNotifications, 1200);

  if(/[?&]test=1(?:&|$)/.test(location.search)){
    window.__CRM__ = {
      get db(){ return db; },
      set db(v){ db = v; },
      get photoCache(){ return photoCache; },
      get photoMode(){ return photoMode; },
      set photoMode(v){ photoMode = v; },
      get swStatus(){ return runtime.swStatus; },
      get corruptInfo(){ return corruptInfo; },
      emptyDB: emptyDB,
      normalizeDB: normalizeDB,
      seedDemo: seedDemo,
      renderAll: renderAll,
      showPage: showPage,
      openCustomerForm: openCustomerForm,
      openOppForm: openOppForm,
      openRecordForm: openRecordForm,
      openCustomer: openCustomer,
      getStats: getStats,
      save: save,
      syncRecordReminder: syncRecordReminder,
      syncStageReminder: syncStageReminder,
      recalcCustomerFollow: recalcCustomerFollow,
      persistPhoto: persistPhoto,
      safeDataUrl: safeDataUrl,
      csvCell: csvCell,
      setOppStage: setOppStage,
      memberOptions: memberOptions,
      deleteCustomer: deleteCustomer,
      closeModal: closeModal,
      state: state
    };
  }
}

document.addEventListener('DOMContentLoaded', function(){
  boot().catch(err => {
    showFatal(err && err.message ? err.message : String(err));
  });
});
