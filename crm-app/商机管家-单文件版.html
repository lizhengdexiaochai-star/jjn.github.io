<style>
/* ============ 商机管家 - 移动端样式 ============ */
:root{
  --bg:#f2f4f8; --card:#ffffff; --line:#e5e8ef;
  --text:#1a2333; --text2:#667085; --text3:#98a2b3;
  --primary:#2563eb; --primary-weak:#e8effe;
  --red:#dc2626; --orange:#ea580c; --green:#16a34a;
  --radius:14px; --shadow:0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
  touch-action:manipulation;
}
button{font-family:inherit;color:inherit}
input,select,textarea{font-family:inherit}
.muted{color:var(--text3);font-weight:400;font-size:12px}
em{font-style:normal}

/* ---------- 错误提示条（脚本出错时可见，便于诊断） ---------- */
.js-error{background:#fdeaea;color:#b42318;padding:10px 16px;font-size:13px;font-weight:600;border-bottom:1px solid #fecaca;word-break:break-all;z-index:999;position:relative}

/* ---------- 顶部栏 ---------- */
.app-header{position:sticky;top:0;z-index:40;background:rgba(242,244,248,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.header-inner{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
#pageTitle{font-size:18px;margin:0;font-weight:700}

/* ---------- 主区域 ---------- */
.main{max-width:640px;margin:0 auto;padding:12px 12px 150px;padding:12px 12px calc(150px + env(safe-area-inset-bottom))}
.page{animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------- 底部导航 ---------- */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding-bottom:0;padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:center}
.tabbar-inner{width:100%;max-width:640px;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;background:none;border:none;color:#98a2b3;font-size:11px;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab.active{color:var(--primary);font-weight:600}

/* ---------- 悬浮按钮 ---------- */
.fab{position:fixed;bottom:76px;bottom:calc(env(safe-area-inset-bottom) + 76px);right:max(20px,calc((100vw - 640px)/2 + 20px));width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;border:none;box-shadow:0 6px 18px rgba(37,99,235,.42);display:flex;align-items:center;justify-content:center;z-index:45;cursor:pointer;transition:transform .15s}
.fab:active{transform:scale(.93)}
.fab svg{width:26px;height:26px}

/* ---------- 卡片 ---------- */
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-title{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}

/* ---------- 首页统计 ---------- */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow)}
.stat-v{font-size:21px;font-weight:800;line-height:1.2;word-break:break-all}
.stat-l{font-size:12px;color:var(--text2);margin-top:2px}

.quick-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.qa{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px;border-radius:var(--radius);border:none;font-size:13px;font-weight:600;cursor:pointer;background:#fff;box-shadow:var(--shadow)}
.qa:active{transform:scale(.97)}
.qa-ico{font-size:22px}
.qa-blue{background:var(--primary-weak);color:var(--primary)}
.qa-violet{background:#f0e9fd;color:#7c3aed}
.qa-green{background:#e7f6ec;color:#16a34a}

/* ---------- 商机漏斗 ---------- */
.funnel-row{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;padding:7px 0;cursor:pointer;text-align:left}
.funnel-row:active{opacity:.7}
.funnel-name{width:42px;flex:none;font-size:13px;font-weight:700;color:var(--st)}
.funnel-bar{flex:1;height:10px;background:#eef1f6;border-radius:999px;overflow:hidden}
.funnel-bar i{display:block;height:100%;border-radius:999px;background:var(--st);min-width:4px;transition:width .3s}
.funnel-num{width:96px;flex:none;text-align:right;font-size:11px;color:var(--text2)}
.funnel-num b{font-size:14px;color:var(--text);margin-right:6px}
.funnel-num em{display:block;font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 阶段颜色 ---------- */
.st-lead{--st:#64748b;--stw:#eef1f5}
.st-need{--st:#0284c7;--stw:#e3f3fc}
.st-intent{--st:#0d9488;--stw:#e2f5f2}
.st-plan{--st:#7c3aed;--stw:#f0e9fd}
.st-quote{--st:#ea580c;--stw:#fef0e5}
.st-bid{--st:#dc2626;--stw:#fdeaea}
.st-deal{--st:#16a34a;--stw:#e7f6ec}
.st-lost{--st:#9ca3af;--stw:#f2f3f5}
.st-badge{background:var(--stw);color:var(--st);font-size:12px;padding:2px 8px;border-radius:6px;font-weight:600;white-space:nowrap}

/* ---------- 待跟进 ---------- */
.task-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f2f4f8}
.task-row:last-child{border-bottom:none}
.task-main{flex:1;min-width:0;cursor:pointer}
.task-name{font-weight:600;font-size:14px}
.task-sub{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.tag-red{background:#fdeaea;color:#dc2626}
.tag-orange{background:#fef0e5;color:#ea580c}
.tag-green{background:#e7f6ec;color:#16a34a}
.tag-blue{background:#e8effe;color:#2563eb}
.tag-slate{background:#eef1f5;color:#64748b}

.never-list{display:flex;flex-wrap:wrap;gap:8px}
.never-chip{background:var(--primary-weak);color:var(--primary);font-size:12px;padding:4px 10px;border-radius:999px;cursor:pointer;font-weight:600}

/* ---------- 按钮 ---------- */
.btn{padding:10px 16px;border-radius:10px;font-size:15px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer;text-align:center}
.btn:active{opacity:.85}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger-text{color:var(--red);border-color:#fecaca}

.mini-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.mini-btn:active{opacity:.8}
.mini-btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.mini-btn.ghost{background:transparent}

/* ---------- 列表项 ---------- */
.item{background:var(--card);border-radius:var(--radius);padding:13px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer}
.item:active{background:#fafbfc}

.cust-top{display:flex;gap:10px;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--primary-weak);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none}
.avatar.big{width:50px;height:50px;font-size:20px}
.cust-info{min-width:0;flex:1}
.cust-name{font-weight:700;font-size:15px}
.cust-sub{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cust-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}

.lvl{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;vertical-align:2px}
.lvl-A{background:#fdeaea;color:#dc2626}
.lvl-B{background:#e8effe;color:#2563eb}
.lvl-C{background:#eef1f5;color:#64748b}

/* ---------- 商机列表 ---------- */
.opp-top{display:flex;gap:8px;align-items:center;margin-bottom:5px}
.opp-name{font-weight:700;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opp-cust{font-size:12px;color:var(--text2);margin-bottom:7px}
.opp-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.opp-amt{font-weight:800;font-size:16px;color:#1d4ed8}
.opp-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dots{display:flex;gap:3px}
.dot{width:8px;height:8px;border-radius:50%;background:#e2e6ee}
.dot.on{background:#2563eb}
.dot.dot-deal.on{background:#16a34a}
.opp-btns{display:flex;gap:6px}

/* ---------- 跟进记录列表 ---------- */
.rec-head{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.type-badge{display:inline-block;background:#eef1f5;color:#475467;font-size:12px;padding:2px 8px;border-radius:6px;font-weight:600;flex:none}
.rec-cust{font-weight:700;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-cust em{color:var(--text3);font-weight:400;font-size:12px}
.rec-content{font-size:13px;color:#344054;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:7px;word-break:break-all}
.rec-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- 搜索与筛选 ---------- */
.searchbar{margin-bottom:10px}
.search{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:16px;color:var(--text);outline:none;-webkit-appearance:none}
.search:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;margin-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--text2);font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center}
.chip i{font-style:normal;font-size:11px;background:#eef1f5;color:#667085;border-radius:999px;padding:0 6px;line-height:16px}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.chip.active i{background:rgba(255,255,255,.28);color:#fff}

/* ---------- 空状态 ---------- */
.empty{padding:36px 12px;text-align:center;color:var(--text3);font-size:14px}

/* ---------- 底部抽屉（客户详情） ---------- */
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;animation:fadeIn .18s ease}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:640px;max-height:88vh;max-height:88dvh;background:#fff;border-radius:20px 20px 0 0;z-index:60;overflow-y:auto;padding:6px 16px 20px;padding:6px 16px calc(20px + env(safe-area-inset-bottom));animation:slideUp .22s ease}
.sheet-handle{width:40px;height:4px;border-radius:999px;background:#d9dde5;margin:6px auto 10px}
@keyframes slideUp{from{transform:translateX(-50%) translateY(60px);opacity:.5}to{transform:translateX(-50%) translateY(0);opacity:1}}
.sheet-head{display:flex;gap:12px;align-items:center;margin:4px 0 10px}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.info-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f2f4f8;font-size:14px;text-decoration:none;color:var(--text);word-break:break-all}
.info-row span{flex:none}
.info-row em{margin-left:auto;color:var(--primary);font-weight:600;font-size:13px}
.mini-opp{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;border-bottom:1px solid #f2f4f8;padding:9px 0;cursor:pointer;text-align:left;font-size:14px}
.mini-opp:last-child{border-bottom:none}
.mini-opp-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mini-opp b{font-size:13px;color:#1d4ed8}
.mini-rec{width:100%;background:none;border:none;border-bottom:1px solid #f2f4f8;padding:9px 0;cursor:pointer;text-align:left}
.mini-rec:last-child{border-bottom:none}
.mini-rec-top{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.mini-rec-content{font-size:13px;color:#344054;text-align:left}

/* ---------- 弹窗 ---------- */
.modal-wrap{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:640px;max-height:90vh;max-height:90dvh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px 20px;padding:16px 16px calc(20px + env(safe-area-inset-bottom));animation:slideUp .22s ease}
.modal-head{font-weight:700;font-size:17px;margin-bottom:14px}
.confirm-msg{font-size:14px;color:#344054;line-height:1.6;margin-bottom:16px;word-break:break-all}
.form-btns{display:flex;gap:10px;margin-top:16px}
.form-btns .btn{flex:1}
.form-btns .spacer{flex:2}
.form-btns .btn.danger-text{flex:1.4}

/* ---------- 表单 ---------- */
.field{margin-bottom:13px}
.field>label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;font-weight:600}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;background:#fff;color:var(--text);outline:none;-webkit-appearance:none}
.field textarea{resize:vertical;font-size:15px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.req{color:var(--red);font-style:normal;margin-left:2px}

.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg-btn{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer}
.seg-btn.on{background:var(--primary);border-color:var(--primary);color:#fff}

.stage-chips{display:flex;flex-wrap:wrap;gap:8px}
.st-chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer}
.st-chip.on{background:var(--stw);color:var(--st);border-color:var(--st)}

/* ---------- 时间线 ---------- */
.timeline{margin-top:4px}
.tl-item{display:flex;gap:10px;padding:5px 0}
.tl-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);margin-top:7px;flex:none}

/* ---------- 我的 ---------- */
.kv{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f2f4f8;font-size:14px}
.kv:last-child{border-bottom:none}
.kv b{font-size:14px}
.row-btn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;border-bottom:1px solid #f2f4f8;padding:13px 2px;font-size:15px;cursor:pointer;text-align:left}

<body>

<noscript><div class="js-error">⚠️ 此应用需要启用 JavaScript，请在浏览器设置中开启后重新打开。</div></noscript>

<input type="file" id="importInput" accept=".json,application/json" hidden>

<script>
/* 单文件版构建标记 */
window.__SINGLE_FILE__ = true;
/* =====================================================
   商机管家 - 客户 · 商机 · 跟进记录管理
   数据保存在浏览器本地 localStorage，可导出 JSON 备份
   ===================================================== */
'use strict';

/* ==================== 运行错误可视化（页面会直接显示错误，便于诊断） ==================== */
function showFatal(msg){
  try{
    const el = document.getElementById('js-error');
    if(el){
      el.hidden = false;
      el.textContent = '⚠️ 应用运行出错：' + msg;
    }
  }catch(e){}
}
window.addEventListener('error', function(e){
  showFatal((e.message || e.type || '未知错误') + (e.lineno ? '（第 ' + e.lineno + ' 行）' : ''));
});

/* ==================== 常量 ==================== */
const DB_KEY = 'shangji-crm-db-v1';
const STAGES = [
  {id:'lead',  name:'线索', cls:'st-lead'},
  {id:'need',  name:'需求', cls:'st-need'},
  {id:'intent',name:'意向', cls:'st-intent'},
  {id:'plan',  name:'方案', cls:'st-plan'},
  {id:'quote', name:'报价', cls:'st-quote'},
  {id:'bid',   name:'投标', cls:'st-bid'},
  {id:'deal',  name:'签单', cls:'st-deal'},
  {id:'lost',  name:'输单', cls:'st-lost'}
];
const ACTIVE_STAGES = STAGES.slice(0, 7); // 线索 → 签单
const RECORD_TYPES = ['电话', '微信', '拜访', '邮件', '其他'];
const LEVELS = [['A','A · 重点客户'], ['B','B · 普通客户'], ['C','C · 潜力客户']];
const SOURCES = ['网络搜索','老客户转介绍','展会','电话开发','广告投放','合作伙伴','其他'];
const INDUSTRIES = ['制造业','贸易','软件/互联网','金融','教育','医疗','建筑/地产','物流','其他'];

/* ==================== 数据 ==================== */
let db = loadDB();
const state = {
  page: 'home',
  custQuery: '', oppQuery: '', oppStage: 'all',
  recQuery: '', recType: 'all'
};

function emptyDB(){ return {customers: [], opps: [], records: []}; }
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return emptyDB();
    const d = JSON.parse(raw);
    if(!d || !Array.isArray(d.customers) || !Array.isArray(d.opps) || !Array.isArray(d.records)) return emptyDB();
    return d;
  }catch(e){ return emptyDB(); }
}
function save(){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
  catch(e){ toast('保存失败：' + e.message); }
}

/* 导入数据净化：强制合法 id、补全字段、校正阶段值（防恶意/损坏的备份文件） */
function sanitizeImported(d){
  const okId = id => typeof id === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(id);
  [d.customers, d.opps, d.records].forEach(arr => {
    const seen = {};
    (arr || []).forEach(x => {
      if(!x || typeof x !== 'object') return;
      if(!okId(x.id) || seen[x.id]) x.id = uid();
      seen[x.id] = 1;
    });
  });
  (d.opps || []).forEach(o => {
    if(!STAGES.some(s => s.id === o.stage)) o.stage = 'lead';
  });
  (d.records || []).forEach(r => {
    r.followDone = !!r.followDone;
  });
  return d;
}

/* ==================== 工具函数 ==================== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function uid(){
  return (window.crypto && crypto.randomUUID && crypto.randomUUID()) ||
    ('id_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
}
function pad2(n){ n = String(n); return n.length < 2 ? '0' + n : n; }
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function nowStr(){
  const d = new Date();
  return todayStr() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function dstr(offset){
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function fmtDT(s){ return s ? String(s).replace('T', ' ') : '—'; }
function daysUntil(dateStr){ return Math.round((new Date(dateStr + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 86400000); }
function fmtMoney(n){
  if(n == null || n === '') return '—';
  const v = Number(n);
  if(isNaN(v)) return '—';
  return '¥' + v.toLocaleString('zh-CN');
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function stageById(id){ return STAGES.find(s => s.id === id) || STAGES[0]; }
function custById(id){ return db.customers.find(c => c.id === id); }
function oppById(id){ return db.opps.find(o => o.id === id); }
function custName(id){ const c = custById(id); return c ? c.name : '（已删除客户）'; }
function show(el){ if(el) el.hidden = false; }
function hide(el){ if(el) el.hidden = true; }

/* ==================== 提示 ==================== */
let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  show(t);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ==================== 页面切换 ==================== */
function showPage(name){
  state.page = name;
  $$('.page').forEach(p => hide(p));
  show($('#page-' + name));
  $$('.tab').forEach(b => b.classList.toggle('active', b.dataset.page === name));
  $('#pageTitle').textContent = $('#page-' + name).dataset.title;
  $('#fab').hidden = !['home','customers','opps','records'].includes(name);
  renderAll();
  window.scrollTo(0, 0);
  if((location.hash || '') !== '#/' + name) location.hash = '#/' + name;
}

function renderAll(){
  renderHome();
  renderCustomers();
  renderOpps();
  renderRecords();
  renderMore();
}

/* ==================== 待跟进任务 ==================== */
function getTasks(){
  const list = [];
  for(const r of db.records){
    if(!r.nextDate || r.followDone) continue;
    const cust = custById(r.customerId);
    if(!cust) continue;
    list.push({r, cust, diff: daysUntil(r.nextDate)});
  }
  return list.sort((a, b) => a.r.nextDate.localeCompare(b.r.nextDate));
}
function customersWithoutRecords(){
  return db.customers.filter(c => !db.records.some(r => r.customerId === c.id));
}

/* ==================== 首页 ==================== */
function statCard(label, val, color){
  return '<div class="stat"><div class="stat-v" style="color:' + color + '">' +
    esc(String(val)) + '</div><div class="stat-l">' + label + '</div></div>';
}
function taskRow(t){
  const d = t.diff;
  const lbl = d < 0 ? ('逾期 ' + (-d) + ' 天') : (d === 0 ? '今天' : (d === 1 ? '明天' : (d + ' 天后')));
  const cls = d < 0 ? 'tag-red' : (d === 0 ? 'tag-orange' : 'tag-slate');
  const brief = t.r.content ? String(t.r.content).slice(0, 30) : '（无内容）';
  return '<div class="task-row">' +
    '<div class="task-main" data-open="' + esc(t.cust.id) + '">' +
      '<div class="task-name">' + esc(t.cust.name) + '</div>' +
      '<div class="task-sub">' + esc(brief) + ' · 下次跟进 ' + esc(t.r.nextDate) + '</div>' +
    '</div>' +
    '<span class="tag ' + cls + '">' + lbl + '</span>' +
    '<button class="mini-btn primary" data-follow="' + esc(t.cust.id) + '">跟进</button>' +
    '<button class="mini-btn ghost" data-done="' + esc(t.r.id) + '">完成</button>' +
  '</div>';
}
function renderHome(){
  const el = $('#page-home');
  const month = todayStr().slice(0, 7);
  const active = db.opps.filter(o => o.stage !== 'deal' && o.stage !== 'lost');
  const tasks = getTasks();
  const due = tasks.filter(t => t.diff <= 0);
  const up = tasks.filter(t => t.diff > 0 && t.diff <= 7);
  const never = customersWithoutRecords();
  const dealAmt = db.opps
    .filter(o => o.stage === 'deal' && (o.winDate || '').slice(0, 7) === month)
    .reduce((s, o) => s + (Number(o.amount) || 0), 0);
  const maxCount = Math.max(1, ...ACTIVE_STAGES.map(s => db.opps.filter(o => o.stage === s.id).length));

  let h = '';
  h += '<div class="stats-grid">' +
    statCard('客户', db.customers.length, '#2563eb') +
    statCard('商机进行中', active.length, '#7c3aed') +
    statCard('待跟进', due.length, '#dc2626') +
    statCard('本月签单金额', dealAmt ? fmtMoney(dealAmt) : '¥0', '#16a34a') +
  '</div>';

  h += '<div class="quick-actions">' +
    '<button class="qa qa-blue" data-qa="customer"><span class="qa-ico">👤</span>新增客户</button>' +
    '<button class="qa qa-violet" data-qa="opp"><span class="qa-ico">🎯</span>新增商机</button>' +
    '<button class="qa qa-green" data-qa="record"><span class="qa-ico">📝</span>新增跟进</button>' +
  '</div>';

  h += '<div class="card"><div class="card-title">商机漏斗 <span class="muted">点按查看</span></div>';
  ACTIVE_STAGES.forEach(s => {
    const list = db.opps.filter(o => o.stage === s.id);
    const amt = list.reduce((x, o) => x + (Number(o.amount) || 0), 0);
    const w = Math.max(3, Math.round(list.length / maxCount * 100));
    h += '<button class="funnel-row" data-funnel="' + s.id + '">' +
      '<span class="funnel-name ' + s.cls + '">' + s.name + '</span>' +
      '<span class="funnel-bar"><i class="' + s.cls + '" style="width:' + w + '%"></i></span>' +
      '<span class="funnel-num"><b>' + list.length + '</b><em>' + (amt ? fmtMoney(amt) : '') + '</em></span>' +
    '</button>';
  });
  h += '</div>';

  h += '<div class="card"><div class="card-title">待跟进 <span class="muted">' + due.length + ' 项</span></div>';
  if(!due.length) h += '<div class="empty">🎉 暂无待跟进任务</div>';
  due.slice(0, 20).forEach(t => { h += taskRow(t); });
  if(up.length){
    h += '<div class="card-title" style="margin-top:12px">7天内即将跟进 <span class="muted">' + up.length + ' 项</span></div>';
    up.slice(0, 10).forEach(t => { h += taskRow(t); });
  }
  h += '</div>';

  if(never.length){
    h += '<div class="card"><div class="card-title">从未跟进 <span class="muted">' + never.length + ' 个客户</span></div>' +
      '<div class="never-list">' +
      never.slice(0, 5).map(c => '<span class="never-chip" data-open="' + esc(c.id) + '">' + esc(c.name) + '</span>').join('') +
      (never.length > 5 ? '<span class="muted">等 ' + never.length + ' 个</span>' : '') +
      '</div></div>';
  }

  el.innerHTML = h;
}

/* ==================== 客户列表 ==================== */
function renderCustomers(){
  const q = state.custQuery.trim().toLowerCase();
  let list = db.customers.slice();
  if(q) list = list.filter(c =>
    ((c.name || '') + ' ' + (c.company || '') + ' ' + (c.contact || '') + ' ' + (c.phone || '')).toLowerCase().includes(q));
  list.sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));

  const el = $('#custList');
  if(!list.length){
    el.innerHTML = '<div class="empty">' + (q ? '没有匹配的客户' : '还没有客户，点右下角 + 添加第一个客户') + '</div>';
    return;
  }
  el.innerHTML = list.map(c => {
    const opps = db.opps.filter(o => o.customerId === c.id);
    const activeN = opps.filter(o => o.stage !== 'deal' && o.stage !== 'lost').length;
    const recs = db.records.filter(r => r.customerId === c.id).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const lastRec = recs[0];
    const t = getTasks().filter(x => x.cust.id === c.id).sort((a, b) => a.diff - b.diff)[0];
    const lvl = LEVELS.find(l => l[0] === c.level);
    return '<div class="item" data-open="' + esc(c.id) + '">' +
      '<div class="cust-top">' +
        '<div class="avatar">' + esc((c.name || '?').slice(0, 1)) + '</div>' +
        '<div class="cust-info">' +
          '<div class="cust-name">' + esc(c.name) + (lvl ? '<span class="lvl lvl-' + lvl[0] + '">' + lvl[0] + '</span>' : '') + '</div>' +
          '<div class="cust-sub">' + esc([c.company, c.contact, c.phone].filter(Boolean).join(' · ') || '未填写详细信息') + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="cust-tags">' +
        (activeN ? '<span class="tag tag-blue">' + activeN + ' 个商机进行中</span>' : '') +
        (lastRec ? '<span class="tag tag-slate">最近跟进 ' + esc(String(lastRec.date).slice(0, 10)) + '</span>' : '') +
        (t ? '<span class="tag ' + (t.diff <= 0 ? 'tag-red' : (t.diff <= 7 ? 'tag-orange' : 'tag-slate')) + '">下次 ' + esc(t.r.nextDate) + '</span>' : '') +
      '</div>' +
    '</div>';
  }).join('');
}

/* ==================== 商机列表 ==================== */
function renderOpps(){
  const chips = $('#oppStageChips');
  chips.innerHTML = [['all', '全部']].concat(STAGES.map(s => [s.id, s.name])).map(pair => {
    const id = pair[0], name = pair[1];
    const n = id === 'all' ? db.opps.length : db.opps.filter(o => o.stage === id).length;
    return '<button class="chip' + (state.oppStage === id ? ' active' : '') + '" data-stage="' + id + '">' + name + '<i>' + n + '</i></button>';
  }).join('');

  let list = db.opps.slice();
  if(state.oppStage !== 'all') list = list.filter(o => o.stage === state.oppStage);
  const q = state.oppQuery.trim().toLowerCase();
  if(q) list = list.filter(o => (o.name + ' ' + custName(o.customerId)).toLowerCase().includes(q));
  list.sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));

  const el = $('#oppList');
  if(!list.length){
    el.innerHTML = '<div class="empty">暂无商机，点右下角 + 添加</div>';
    return;
  }
  el.innerHTML = list.map(o => {
    const s = stageById(o.stage);
    const idx = STAGES.indexOf(s);
    const dots = s.id === 'lost' ? '' :
      '<div class="dots">' + ACTIVE_STAGES.map((st, i) =>
        '<i class="dot' + (i <= idx ? ' on' : '') + (st.id === 'deal' ? ' dot-deal' : '') + '"></i>').join('') + '</div>';
    let btns = '';
    if(s.id !== 'lead' && s.id !== 'lost') btns += '<button class="mini-btn ghost" data-prev="' + esc(o.id) + '">上一阶段</button>';
    if(s.id !== 'deal' && s.id !== 'lost') btns += '<button class="mini-btn primary" data-next="' + esc(o.id) + '">' + (s.id === 'bid' ? '签单' : '下一阶段') + '</button>';
    if(s.id === 'lost') btns += '<button class="mini-btn" data-reopen="' + esc(o.id) + '">↩ 移回线索</button>';
    return '<div class="item" data-opp="' + esc(o.id) + '">' +
      '<div class="opp-top"><span class="st-badge ' + s.cls + '">' + s.name + '</span>' +
      '<span class="opp-name">' + esc(o.name) + '</span></div>' +
      '<div class="opp-cust">客户：' + esc(custName(o.customerId)) + '</div>' +
      '<div class="opp-meta">' +
        '<span class="opp-amt">' + fmtMoney(o.amount) + '</span>' +
        (o.expectDate ? '<span class="tag tag-slate">预计 ' + esc(o.expectDate) + '</span>' : '') +
        (o.winDate ? '<span class="tag tag-green">签单 ' + esc(o.winDate) + '</span>' : '') +
      '</div>' +
      '<div class="opp-foot">' + dots + '<div class="opp-btns">' + btns + '</div></div>' +
    '</div>';
  }).join('');
}

/* 商机阶段推进 / 回退 */
function moveOpp(oppId, dir){
  const o = oppById(oppId);
  if(!o || o.stage === 'lost') return;
  const cur = stageById(o.stage);
  let idx = STAGES.findIndex(s => s.id === o.stage);
  if(idx < 0) idx = 0;
  let ni = idx + dir;
  if(ni > 6) ni = 6;   // 6 = 签单
  if(ni < 0) ni = 0;
  const to = STAGES[ni];
  if(to.id === cur.id) return;
  o.history = o.history || [];
  o.history.push({at: nowStr(), from: cur.name, to: to.name});
  o.stage = to.id;
  o.updatedAt = nowStr();
  if(to.id === 'deal' && !o.winDate) o.winDate = todayStr();
  save();
  renderAll();
  if(to.id === 'deal') toast('🎉 恭喜签单：' + o.name);
  else toast('已推进：' + cur.name + ' → ' + to.name);
}

function renderRecords(){
  const chips = $('#recTypeChips');
  chips.innerHTML = [['all', '全部']].concat(RECORD_TYPES.map(t => [t, t])).map(pair => {
    const id = pair[0], name = pair[1];
    const n = id === 'all' ? db.records.length : db.records.filter(r => r.type === id).length;
    return '<button class="chip' + (state.recType === id ? ' active' : '') + '" data-type="' + id + '">' + name + '<i>' + n + '</i></button>';
  }).join('');

  let list = db.records.slice();
  if(state.recType !== 'all') list = list.filter(r => r.type === state.recType);
  const q = state.recQuery.trim().toLowerCase();
  if(q) list = list.filter(r => (r.content + ' ' + custName(r.customerId)).toLowerCase().includes(q));
  list.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  const el = $('#recList');
  if(!list.length){
    el.innerHTML = '<div class="empty">暂无跟进记录，点右下角 + 添加</div>';
    return;
  }
  el.innerHTML = list.map(r => {
    const o = r.oppId ? oppById(r.oppId) : null;
    let dueBadge = '';
    if(r.nextDate){
      if(r.followDone) dueBadge = '<span class="tag tag-slate">已跟进</span>';
      else dueBadge = '<span class="tag ' + (daysUntil(r.nextDate) <= 0 ? 'tag-red' : 'tag-orange') + '">下次 ' + esc(r.nextDate) + '</span>';
    }
    return '<div class="item" data-rec="' + esc(r.id) + '">' +
      '<div class="rec-head"><span class="type-badge">' + esc(r.type || '其他') + '</span>' +
      '<span class="rec-cust">' + esc(custName(r.customerId)) + (o ? '<em> · ' + esc(o.name) + '</em>' : '') + '</span></div>' +
      '<div class="rec-content">' + esc(r.content) + '</div>' +
      '<div class="rec-foot"><span class="muted">' + fmtDT(r.date) + '</span>' + dueBadge + '</div>' +
    '</div>';
  }).join('');
}

/* ==================== 数据导出 / 导入 ==================== */
function download(content, filename, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportJSON(){
  download(JSON.stringify(db, null, 2), '商机管家备份_' + todayStr() + '.json', 'application/json');
  toast('备份已导出');
}
function exportCustomersCSV(){
  const head = ['客户名称','联系人','电话','公司','行业','客户来源','客户等级','地址','备注','创建时间'];
  const rows = db.customers.map(c => [
    c.name, c.contact, c.phone, c.company, c.industry, c.source, c.level, c.address, c.remark, (c.createdAt || '').slice(0, 10)
  ]);
  const csv = '\ufeff' + [head].concat(rows).map(r =>
    r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')
  ).join('\r\n');
  download(csv, '客户列表_' + todayStr() + '.csv', 'text/csv;charset=utf-8');
  toast('客户表格已导出');
}

        '<div class="spacer"></div>' +
        '<button type="button" class="btn ghost" data-close>取消</button>' +
        '<button type="submit" class="btn primary">保存</button>' +
      '</div>' +
    '</form>'
  );
  syncOppOptions(r.customerId || presetCustomerId || '', r.oppId || '');
  $('#f-rcust').addEventListener('change', () => syncOppOptions($('#f-rcust').value, ''));
  $$('#recForm .seg-btn').forEach(b => b.addEventListener('click', () => {
    $('#f-rtype').value = b.dataset.rtype;
    $$('#recForm .seg-btn').forEach(x => x.classList.toggle('on', x === b));
  }));
  if(rec){
    $('#f-rdel').addEventListener('click', () => {
      const rid = rec.id;
      closeModal();
      confirmDlg({
        title: '删除跟进记录',
        msg: '确定删除这条跟进记录？',
        okText: '删除',
        danger: true,
        onOk: () => {
          db.records = db.records.filter(x => x.id !== rid);
          save(); renderAll(); toast('记录已删除');
        }
      });
    });
  }
  $('#recForm').addEventListener('submit', ev => {
    ev.preventDefault();
    const customerId = $('#f-rcust').value;
    const content = $('#f-rcontent').value.trim();
    if(!customerId){ toast('请选择客户'); return; }
    if(!content){ toast('请填写记录内容'); $('#f-rcontent').focus(); return; }
    const nextDate = $('#f-rnext').value;
    const data = {
      customerId,
      oppId: $('#f-ropp').value || '',
      type: $('#f-rtype').value,
      date: $('#f-rdate').value || defaultDT,
      nextDate,
      content,
      followDone: !nextDate
    };
    let savedRec = rec || null;
    if(rec){
      Object.assign(rec, data);
      rec.updatedAt = nowStr();
      toast('已保存');
    }else{
      savedRec = Object.assign({id: uid(), createdAt: nowStr(), updatedAt: nowStr()}, data);
      db.records.push(savedRec);
      toast('跟进记录已保存');
    }
    if(nextDate){
      // 自动完成该客户此前的待跟进任务（已被本次跟进取代），排除刚保存的这条
      db.records.forEach(x => {
        if(x.id !== savedRec.id && x.customerId === customerId && x.nextDate && !x.followDone){
          x.followDone = true;
        }
      });
    }
    save();
    closeModal();
    renderAll();
  });
}

/* ==================== 客户详情（底部抽屉） ==================== */
function openCustomer(id){
  const c = custById(id);
  if(!c) return;
  const lvl = LEVELS.find(l => l[0] === c.level);
  const opps = db.opps.filter(o => o.customerId === id).sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
  const recs = db.records.filter(r => r.customerId === id).sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  $('#sheetBody').innerHTML =
    '<div class="sheet-head">' +
      '<div class="avatar big">' + esc((c.name || '?').slice(0, 1)) + '</div>' +
      '<div><div class="cust-name">' + esc(c.name) + (lvl ? '<span class="lvl lvl-' + lvl[0] + '">' + lvl[0] + '</span>' : '') + '</div>' +
      '<div class="muted">' + esc([c.company, c.industry].filter(Boolean).join(' · ') || '未填写公司/行业') + '</div></div>' +
    '</div>' +
    (c.phone ? '<a class="info-row" href="tel:' + esc(c.phone) + '"><span>📞</span>' + esc(c.phone) + '<em>拨打</em></a>' : '') +
    (c.contact ? '<div class="info-row"><span>👤</span>联系人：' + esc(c.contact) + '</div>' : '') +
    (c.source ? '<div class="info-row"><span>🔎</span>来源：' + esc(c.source) + '</div>' : '') +
    (c.address ? '<div class="info-row"><span>📍</span>' + esc(c.address) + '</div>' : '') +
    (c.remark ? '<div class="info-row"><span>📌</span>' + esc(c.remark) + '</div>' : '') +
    '<div class="sheet-actions">' +
      '<button class="btn primary" id="sheetNewOpp">＋ 新增商机</button>' +
      '<button class="btn" id="sheetNewRec">＋ 跟进记录</button>' +
      '<button class="btn ghost" id="sheetEdit">编辑</button>' +
      '<button class="btn ghost danger-text" id="sheetDel">删除</button>' +
    '</div>' +
    '<div class="card"><div class="card-title">商机（' + opps.length + '）</div>' +
      (opps.length ? opps.map(o => {
        const s = stageById(o.stage);
        return '<button class="mini-opp" data-edit-opp="' + esc(o.id) + '">' +
          '<span class="st-badge ' + s.cls + '">' + s.name + '</span>' +
          '<span class="mini-opp-name">' + esc(o.name) + '</span>' +
          '<b>' + fmtMoney(o.amount) + '</b></button>';
      }).join('') : '<div class="empty">暂无商机</div>') +
    '</div>' +
    '<div class="card"><div class="card-title">跟进记录（' + recs.length + '）</div>' +
      (recs.length ? recs.slice(0, 30).map(r =>
        '<button class="mini-rec" data-edit-rec="' + esc(r.id) + '">' +
        '<div class="mini-rec-top"><span class="type-badge">' + esc(r.type || '其他') + '</span>' +
        '<span class="muted">' + fmtDT(r.date) + '</span>' +
        (r.nextDate && !r.followDone ? '<span class="tag tag-orange">下次 ' + esc(r.nextDate) + '</span>' : '') +
        '</div><div class="mini-rec-content">' + esc(r.content) + '</div></button>'
      ).join('') : '<div class="empty">暂无跟进记录</div>') +
    '</div>';

  show($('#backdrop'));
  show($('#sheet'));

  $('#sheetNewOpp').onclick = () => openOppForm(null, id);
  $('#sheetNewRec').onclick = () => openRecordForm(null, id);
  $('#sheetEdit').onclick = () => { closeSheet(); openCustomerForm(c); };
  $('#sheetDel').onclick = () => {
    closeSheet();
    confirmDlg({
      title: '删除客户',
      msg: '将同时删除「' + c.name + '」的 ' + opps.length + ' 个商机和 ' + recs.length + ' 条跟进记录，确定删除？',
      okText: '删除',
      danger: true,
      onOk: () => {
        db.customers = db.customers.filter(x => x.id !== id);
        db.opps = db.opps.filter(x => x.customerId !== id);
        db.records = db.records.filter(x => x.customerId !== id);
        save(); renderAll(); toast('已删除');
      }
    });
  };
}
function closeSheet(){
  hide($('#sheet'));
  hide($('#backdrop'));
}

/* ==================== 悬浮按钮 ==================== */
function openFabMenu(){
  openModal(
    '<div class="modal-head">快捷新增</div>' +
    '<button class="row-btn" id="fabCust"><span>👤</span>新增客户<em>›</em></button>' +
    '<button class="row-btn" id="fabOpp"><span>🎯</span>新增商机<em>›</em></button>' +
    '<button class="row-btn" id="fabRec"><span>📝</span>新增跟进记录<em>›</em></button>' +
    '<div class="form-btns"><button type="button" class="btn ghost" data-close>取消</button></div>'
  );
  $('#fabCust').onclick = () => { closeModal(); openCustomerForm(); };
  $('#fabOpp').onclick = () => { closeModal(); openOppForm(); };
  $('#fabRec').onclick = () => { closeModal(); openRecordForm(); };
}

/* ==================== 事件绑定 ==================== */
function init(){
  // 底部导航
  $$('.tab').forEach(b => b.addEventListener('click', () => showPage(b.dataset.page)));

  // 悬浮按钮
  $('#fab').addEventListener('click', () => {
    if(state.page === 'home') openFabMenu();
    else if(state.page === 'customers') openCustomerForm();
    else if(state.page === 'opps') openOppForm();
    else openRecordForm();
  });

  // 遮罩关闭
  $('#backdrop').addEventListener('click', closeSheet);
  $('#modalBackdrop').addEventListener('click', closeModal);
  $('#modalBox').addEventListener('click', e => { if(e.target.closest('[data-close]')) closeModal(); });

  // 客户详情抽屉内的商机 / 记录点击（委托，只绑定一次）
  $('#sheetBody').addEventListener('click', e => {
    const eo = e.target.closest('[data-edit-opp]');
    if(eo){ closeSheet(); openOppForm(oppById(eo.dataset.editOpp)); return; }
    const er = e.target.closest('[data-edit-rec]');
    if(er){ closeSheet(); openRecordForm(db.records.find(x => x.id === er.dataset.editRec)); return; }
  });

  // 搜索
  $('#custQuery').addEventListener('input', e => { state.custQuery = e.target.value; renderCustomers(); });
  $('#oppQuery').addEventListener('input', e => { state.oppQuery = e.target.value; renderOpps(); });
  $('#recQuery').addEventListener('input', e => { state.recQuery = e.target.value; renderRecords(); });

  // 筛选
  $('#oppStageChips').addEventListener('click', e => {
    const b = e.target.closest('[data-stage]');
    if(b){ state.oppStage = b.dataset.stage; renderOpps(); }
  });
  $('#recTypeChips').addEventListener('click', e => {
    const b = e.target.closest('[data-type]');
    if(b){ state.recType = b.dataset.type; renderRecords(); }
  });

  // 首页交互
  $('#page-home').addEventListener('click', e => {
    const qa = e.target.closest('[data-qa]');
    if(qa){
      if(qa.dataset.qa === 'customer') openCustomerForm();
      else if(qa.dataset.qa === 'opp') openOppForm();
      else openRecordForm();
      return;
    }
    const fn = e.target.closest('[data-funnel]');
    if(fn){ state.oppStage = fn.dataset.funnel; showPage('opps'); return; }
    const fw = e.target.closest('[data-follow]');
    if(fw){ openRecordForm(null, fw.dataset.follow); return; }
    const dn = e.target.closest('[data-done]');
    if(dn){
      const r = db.records.find(x => x.id === dn.dataset.done);
      if(r) confirmDlg({
        title: '标记跟进完成',
        msg: '确认已完成对「' + custName(r.customerId) + '」的本次跟进？',
        okText: '完成',
        onOk: () => {
          r.followDone = true;
          save(); renderAll(); toast('已标记完成');
        }
      });
      return;
    }
    const op = e.target.closest('[data-open]');
    if(op) openCustomer(op.dataset.open);
  });

  // 客户列表
  $('#custList').addEventListener('click', e => {
    const it = e.target.closest('[data-open]');
    if(it) openCustomer(it.dataset.open);
  });

  // 商机列表
  $('#oppList').addEventListener('click', e => {
    const p = e.target.closest('[data-prev]');
    if(p){ moveOpp(p.dataset.prev, -1); return; }
    const n = e.target.closest('[data-next]');
    if(n){ moveOpp(n.dataset.next, 1); return; }
    const r = e.target.closest('[data-reopen]');
    if(r){
      const o = oppById(r.dataset.reopen);
      if(o){
        o.history = (o.history || []).concat([{at: nowStr(), from: '输单', to: '线索'}]);
        o.stage = 'lead';
        o.updatedAt = nowStr();
        save(); renderAll(); toast('已移回线索');
      }
      return;
    }
    const it = e.target.closest('[data-opp]');
    if(it) openOppForm(oppById(it.dataset.opp));
  });

  // 记录列表
  $('#recList').addEventListener('click', e => {
    const it = e.target.closest('[data-rec]');
    if(it) openRecordForm(db.records.find(x => x.id === it.dataset.rec));
  });

  // 导入备份
  $('#importInput').addEventListener('change', e => {
    const f = e.target.files[0];
    e.target.value = '';
    if(!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      try{
        const d = JSON.parse(fr.result);
        if(!d || !Array.isArray(d.customers) || !Array.isArray(d.opps) || !Array.isArray(d.records)) throw new Error('bad');
        confirmDlg({
          title: '导入数据',
          msg: '备份包含 ' + d.customers.length + ' 个客户、' + d.opps.length + ' 个商机、' + d.records.length + ' 条记录。导入将覆盖当前全部数据，确定继续？',
          okText: '导入',
          onOk: () => {
            db = sanitizeImported({customers: d.customers, opps: d.opps, records: d.records});
            save(); renderAll(); toast('导入成功');
          }
        });
      }catch(err){
        toast('文件格式不正确，导入失败');
      }
    };
    fr.readAsText(f);
  });

  // 路由
  window.addEventListener('hashchange', () => {
    const p = (location.hash || '').replace(/^#\//, '');
    if(p && p !== state.page && $('#page-' + p)) showPage(p);
  });

  // 初始页面
  const initPage = (location.hash || '').replace(/^#\//, '');
  showPage(initPage && $('#page-' + initPage) ? initPage : 'home');

  // 离线缓存（仅 http/https 环境生效；单文件版不注册，避免缓存缺失文件）
  if('serviceWorker' in navigator && location.protocol.startsWith('http') && !window.__SINGLE_FILE__){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

document.addEventListener('DOMContentLoaded', function(){
  try{ init(); }
  catch(err){ showFatal(err && err.message ? err.message : String(err)); }
});

</script>
</body>
</html>
